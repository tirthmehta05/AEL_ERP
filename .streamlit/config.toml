# Streamlit Configuration - Essential Settings Only

[server]
# Port to run the app on (change if 8501 is in use)
port = 8501

# Host to bind to
headless = true

# Maximum upload size in MB
maxUploadSize = 200

# Enable websocket compression
enableWebsocketCompression = true

# Base path for the app
baseUrlPath = ""

[browser]
# Server address to display in browser
serverAddress = "localhost"

# Whether to gather usage stats
gatherUsageStats = false

[theme]
# Force light mode so the app looks consistent on all PCs regardless of OS dark mode setting
base = "light"

# Primary color (hex color)
primaryColor = "#4A4AFF"

# Background color (hex color)
backgroundColor = "#F7F7FF"

# Secondary background color (hex color)
secondaryBackgroundColor = "#FFFFFF"

# Text color (hex color)
textColor = "#1A1A2E"

# Font family
font = "sans serif"

[client]
# Show error details
showErrorDetails = true

# Toolbar mode: "auto", "minimal", "viewer", "developer"
toolbarMode = "auto"

# Show sidebar navigation
showSidebarNavigation = false

[logger]
# Log level: "error", "warning", "info", "debug"
level = "info"

[runner]
# Fast reruns
fastReruns = true

# Magic enabled
magicEnabled = true
